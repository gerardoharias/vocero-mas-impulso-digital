allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Triaje de Dependabot 2026-09-17 (ver memory/feedback-dependabot-triage.md):
# fija transitivos vulnerables a su primera versión parchada. postcss/nanoid/
# js-yaml/browserslist son build-time, nunca corren en el standalone de
# producción. El parche de seguridad de Vocero raíz 2.5.3 (2026-10-28)
# requiere sharp >=0.35.5 junto con Next >=15.5.28, y zod 4 >=4.6.7
# para better-auth. El override de zod sólo cubre la rama 4: la app sigue
# usando zod 3 y sus esquemas existentes.
overrides:
  nanoid@<3.3.18: "^3.3.18"
  js-yaml@<4.3.2: "^4.3.2"
  browserslist@<4.28.7: "^4.28.7"
  baseline-browser-mapping@<2.11.0: "^2.11.0"
  postcss@<8.5.23: "^8.5.23"
  sharp: "^0.35.5"
  "zod@>=4.0.0 <4.6.6": "^4.6.7"
  # 2026-09-18 — @esbuild-kit/* (deprecated, arrastrado por drizzle-kit) trae
  # su propio esbuild@0.18.20, viejo, aparte del que ya resuelve el resto del
  # árbol (vite/vitest/tsx) en >=0.25.0. drizzle-kit es CLI de build-time,
  # nunca corre en el standalone de producción (memory/feedback-dependabot-triage.md).
  esbuild@<0.25.0: "^0.25.0"
